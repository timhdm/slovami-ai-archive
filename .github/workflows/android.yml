name: Android checks
on:
  push:
    branches:
      - fix/eres2net-diarization-crash
  pull_request:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Run unit tests in addition to building the APK
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4

      - name: Cache sherpa-onnx 1.13.1 AAR
        id: sherpa-cache
        uses: actions/cache@v4
        with:
          path: app/libs/sherpa-onnx.aar
          key: sherpa-onnx-aar-1.13.1-1cae99f3330e8da1

      - name: Download sherpa-onnx 1.13.1 (cache miss)
        if: steps.sherpa-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p app/libs
          curl --fail --location --retry 3 --output app/libs/sherpa-onnx.aar \
            "https://huggingface.co/csukuangfj2/sherpa-onnx-libs/resolve/main/android/aar/1.13.1/sherpa-onnx-static-link-onnxruntime-1.13.1.aar"

      - name: Verify sherpa-onnx AAR checksum
        shell: bash
        run: |
          echo "1cae99f3330e8da180cbf9d2e20c5257d4444d8713c4df4094a9471a2c11300b  app/libs/sherpa-onnx.aar" | sha256sum --check

      - name: Restore persistent debug signing key
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          test -n "$DEBUG_KEYSTORE_BASE64"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/protocolvoice-debug.jks"
          chmod 600 "$RUNNER_TEMP/protocolvoice-debug.jks"

      - name: Build signed debug APK
        env:
          DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/protocolvoice-debug.jks
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Run unit tests (pull requests or requested full check)
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.run_tests) }}
        env:
          DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/protocolvoice-debug.jks
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon testDebugUnitTest

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: slovami-ai-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
